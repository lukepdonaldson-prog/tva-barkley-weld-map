{% extends 'welds/base.html' %}

{% block title %}Delete NDE Report — TVA Barkley{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card border-danger">
            <div class="card-body p-4">
                <h4 class="text-danger mb-3">⚠️ Confirm Delete</h4>
                <p class="mb-4">Are you sure you want to delete '{{ report.title }}'?</p>
                <form method="post" class="d-flex gap-2 flex-wrap">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    <a href="{% url 'report_list' %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
